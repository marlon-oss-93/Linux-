name: Q4OS DeepHat RDP

on:
  workflow_dispatch:

jobs:
  q4os:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      VM_NAME: q4os-mobile
      VM_DIR: /home/runner/q4os
      RAM_MB: "1024"
      CPU_CORES: "2"
      DISK_SIZE: "145G"
      Q4OS_USER: "ZynexDEX"
      Q4OS_PASSWORD: "ZynexDEX123!"
      RDP_PORT: "3389"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
      Q4OS_ISO: "q4os-6.9-x64-instcd.r1.iso"
      Q4OS_ISO_URL: "https://sourceforge.net/projects/q4os/files/stable/q4os-6.9-x64-instcd.r1.iso/download"

    steps:
      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget curl git python3 iproute2 procps

      - name: Prepare files
        run: |
          set -e
          mkdir -p "$VM_DIR/logs"
          mkdir -p "$VM_DIR/novnc"

      - name: Download Q4OS
        run: |
          set -e
          cd "$VM_DIR"
          wget --tries=3 --timeout=60 -O "$Q4OS_ISO" "$Q4OS_ISO_URL"
          test -s "$Q4OS_ISO"
          ls -lh "$Q4OS_ISO"

      - name: Create 145GB virtual disk
        run: |
          set -e
          qemu-img create -f qcow2 "$VM_DIR/$VM_NAME.qcow2" "$DISK_SIZE"
          qemu-img info "$VM_DIR/$VM_NAME.qcow2"

      - name: Start Q4OS
        run: |
          set -e
          cd "$VM_DIR"

          nohup qemu-system-x86_64 \
            -name "$VM_NAME" \
            -machine q35 \
            -accel tcg,thread=multi \
            -m "$RAM_MB" \
            -smp "$CPU_CORES" \
            -cpu max \
            -drive "file=$VM_NAME.qcow2,format=qcow2,if=virtio" \
            -cdrom "$Q4OS_ISO" \
            -boot order=d \
            -vga virtio \
            -display none \
            -vnc "0.0.0.0:0" \
            -netdev "user,id=net0,hostfwd=tcp::$RDP_PORT-:3389" \
            -device "virtio-net-pci,netdev=net0" \
            > "$VM_DIR/logs/qemu.log" 2>&1 &

          echo $! > "$VM_DIR/qemu.pid"

          sleep 10

          kill -0 "$(cat "$VM_DIR/qemu.pid")"

      - name: Install noVNC
        run: |
          set -e

          if [ ! -d "$VM_DIR/novnc/.git" ]; then
            git clone --depth 1 \
              https://github.com/novnc/noVNC.git \
              "$VM_DIR/novnc"
          fi

          test -f "$VM_DIR/novnc/utils/novnc_proxy"

      - name: Start noVNC
        run: |
          set -e
          cd "$VM_DIR/novnc"

          nohup ./utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 0.0.0.0:6080 \
            > "$VM_DIR/logs/novnc.log" 2>&1 &

          echo $! > "$VM_DIR/novnc.pid"

          sleep 5

          kill -0 "$(cat "$VM_DIR/novnc.pid")"

      - name: Install Tailscale
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo service tailscaled start || true

          sleep 5

          pgrep -x tailscaled

      - name: Connect Tailscale
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TS_AUTH_KEY" ]; then
            echo "ERROR: repository secret TAILSCALE_AUTHKEY is missing."
            exit 1
          fi

          sudo tailscale up \
            --auth-key="$TS_AUTH_KEY" \
            --hostname="gh-q4os-${GITHUB_RUN_ID}" \
            --accept-routes=false \
            --timeout=30s

          sleep 5

          TS_IP="$(sudo tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale IP was not assigned."
            sudo tailscale status || true
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: DeepHat session
        run: |
          echo "===================================================="
          echo "        SESSION ACTIVE - DEEPHAT TUNED"
          echo "===================================================="
          echo "  [+] IP ADDRESS:     $TAILSCALE_IP"
          echo "  [+] USERNAME:       $Q4OS_USER"
          echo "  [+] PASSWORD:       $Q4OS_PASSWORD"
          echo "===================================================="
          echo "  [+] STORAGE:        145GB VIRTUAL"
          echo "  [+] RAM:             1GB"
          echo "  [+] CPU:             2 vCPU"
          echo "  [+] RDP PORT:        3389"
          echo "  [+] VNC PORT:        5900"
          echo "  [+] NOVNC PORT:      6080"
          echo "===================================================="
          echo "  [!] STATUS:          ONLINE"
          echo "===================================================="
          echo "  [!] Use Windows App with the Tailscale IP."
          echo "===================================================="

      - name: Diagnostics
        run: |
          echo "Tailscale:"
          sudo tailscale status || true

          echo ""
          echo "Listening ports:"
          ss -lntp || true

          echo ""
          echo "QEMU:"
          ps aux | grep qemu-system-x86_64 | grep -v grep || true

      - name: Keep session alive
        run: |
          while true; do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
              echo "QEMU stopped."
              cat "$VM_DIR/logs/qemu.log" || true
              exit 1
            fi

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Q4OS VM ONLINE - $TAILSCALE_IP"

            sleep 300
          done

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: DeepHat-Q4OS-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/runner/q4os
          retention-days: 1EPHAT SESSION MONITOR"
          echo "===================================================="

          while true
          do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null
            then
              echo "ERROR: QEMU STOPPED."
              echo ""
              cat "$VM_DIR/logs/qemu.log" || true
              exit 1
            fi

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Q4OS VM ONLINE"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Tailscale: $TAILSCALE_IP"

            sleep 300
          done

      - name: Upload session files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "DeepHat-Q4OS-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "/home/runner/q4os"
          retention-days: 1 - name: Monitor Session
        run: |
          set -e

          echo "===================================================="
          echo "        DEEPHAT SESSION MONITOR"
          echo "===================================================="

          while true
          do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
              echo "QEMU STOPPED."
              echo ""
              echo "===== QEMU LOG ====="
              cat "$VM_DIR/logs/qemu.log" || true
              exit 1
            fi

            if [ -f "$VM_DIR/novnc.pid" ]; then
              if ! kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null; then
                echo "WARNING: noVNC stopped."
              fi
            fi

            echo "[$(date)] Q4OS VM ONLINE"
            echo "[$(date)] Tailscale: $TAILSCALE_IP"

            sleep 300
          done

      - name: Save DeepHat Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "DeepHat-Q4OS-Session-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            /home/runner/q4os/logs/
            /home/runner/q4os/session-report.txt
            /home/runner/q4os/vm-info.txt
          retention-days: 1======================"

          echo ""
          echo "QEMU:"

          if kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
            exit 1
          fi

          echo ""
          echo "noVNC:"

          if kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
          fi

          echo ""
          echo "PORTS:"
          ss -lnt | grep -E ":5900|:6080|:3389" || true

      - name: Create Session Report
        run: |
          cat > "$VM_DIR/session-report.txt" <<EOF
          ==========================================
                  DEEPHAT Q4OS SESSION
          ==========================================

          VM: $VM_NAME
          RAM: ${RAM_MB}MB
          CPU: $CPU_CORES
          STORAGE: $DISK_SIZE
          USERNAME: $Q4OS_USER
          TAILSCALE IP: $TAILSCALE_IP
          VNC PORT: $VNC_PORT
          NOVNC PORT: $NOVNC_PORT
          RDP PORT: $RDP_PORT
          STATUS: ONLINE

          ==========================================
          EOF

          cat "$VM_DIR/session-report.txt"

      - name: Monitor Session
        run: |
          set -e

          echo "===================================================="
          echo "        DEEPHAT SESSION MONITOR"
          echo "===================================================="

          while true
          do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
              echo "QEMU STOPPED."
              echo ""
              echo "===== QEMU LOG ====="
              cat "$VM_DIR/logs/qemu.log" || true
              exit 1
            fi

            if [ -f "$VM_DIR/novnc.pid" ]; then
              if ! kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null; then
                echo "WARNING: noVNC stopped."
              fi
            fi

            echo "[$(date)] Q4OS VM ONLINE"
            echo "[$(date)] Tailscale: $TAILSCALE_IP"

            sleep 300
          done

      - name: Save DeepHat Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepHat-Q4OS-Session-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /home/runner/q4os/logs/
            /home/runner/q4os/session-report.txt
            /home/runner/q4os/vm-info.txt
          retention-days: 1E - DEEPHAT TUNED 🚀        "
          Write-Host "===================================================="
          Write-Host "  [+] IP ADDRESS:     $ip"
          Write-Host "  [+] USERNAME:       $user"
          Write-Host "  [+] PASSWORD:       $pass"
          Write-Host "===================================================="
          Write-Host "  [+] STORAGE:        145GB (VIRTUAL EXPANSION)"
          Write-Host "  [+] RAM:             1GB"
          Write-Host "  [+] CPU:             2 vCPU"
          Write-Host "  [+] MODE:           GAMING OVERDRIVE (DEBLOATED)"
          Write-Host "===================================================="
          Write-Host "  [!] STATUS:         ONLINE"
          Write-Host "===================================================="
          Write-Host "  [!] DICA: Use o Windows App para conectar."
          Write-Host "===================================================="

      - name: Service Check
        run: |
          echo "===================================================="
          echo "SERVICE CHECK"
          echo "===================================================="

          echo ""
          echo "QEMU:"

          if kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
            exit 1
          fi

          echo ""
          echo "noVNC:"

          if kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
          fi

          echo ""
          echo "PORTS:"
          ss -lnt | grep -E ":5900|:6080|:3389" || true

          echo ""
          echo "TAILSCALE:"
          sudo tailscale status || true

      - name: Create Session Report
        run: |
          cat > "$VM_DIR/session-report.txt" <<EOF
          ==========================================
                  DEEPHAT Q4OS SESSION
          ==========================================

          VM:
          $VM_NAME

          RAM:
          ${RAM_MB}MB

          CPU:
          $CPU_CORES

          STORAGE:
          $DISK_SIZE

          USERNAME:
          $Q4OS_USER

          TAILSCALE IP:
          $TAILSCALE_IP

          VNC PORT:
          $VNC_PORT

          NOVNC PORT:
          $NOVNC_PORT

          RDP PORT:
          $RDP_PORT

          STATUS:
          ONLINE

          ==========================================
          EOF

          cat "$VM_DIR/session-report.txt"

      - name: Monitor Session
        run: |
          set -e

          echo "===================================================="
          echo "        DEEPHAT SESSION MONITOR"
          echo "===================================================="

          while true
          do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null
            then
              echo "QEMU STOPPED."
              echo ""
              echo "===== QEMU LOG ====="
              cat "$VM_DIR/logs/qemu.log" || true
              exit 1
            fi

            if [ -f "$VM_DIR/novnc.pid" ]; then
              if ! kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null
              then
                echo "WARNING: noVNC stopped."
              fi
            fi

            echo "[$(date)] Q4OS VM ONLINE"
            echo "[$(date)] Tailscale: $TAILSCALE_IP"

            sleep 300
          done

      # =========================================================
      # ARTIFACT
      # =========================================================

      - name: Save DeepHat Logs
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: DeepHat-Q4OS-Session-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            /home/runner/q4os/logs/
            /home/runner/q4os/session-report.txt
            /home/runner/q4os/vm-info.txt

          retention-days: 1SCALE_AUTHKEY secret is missing."
            echo ""
            echo "Create this GitHub Repository Secret:"
            echo ""
            echo "TAILSCALE_AUTHKEY"
            echo ""
            exit 1
          fi

          echo "Auth key detected."
          echo "Connecting to Tailscale..."

          sudo tailscale up \
            --auth-key="$TS_AUTH_KEY" \
            --hostname="gh-q4os-${GITHUB_RUN_ID}" \
            --accept-routes=false \
            --timeout=30s

          sleep 5

          echo ""
          echo "===================================================="
          echo "TAILSCALE STATUS"
          echo "===================================================="

          sudo tailscale status

          TS_IP=$(sudo tailscale ip -4 | head -n 1)

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale IP was not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo ""
          echo "===================================================="
          echo "      TAILSCALE LOGIN SUCCESS"
          echo "===================================================="
          echo "Hostname: gh-q4os-${GITHUB_RUN_ID}"
          echo "IP: $TS_IP"
          echo "===================================================="

      # =========================================================
      # NETWORK DIAGNOSTICS
      # =========================================================

      - name: Network Diagnostics
        run: |
          echo "===================================================="
          echo "NETWORK DIAGNOSTICS"
          echo "===================================================="

          echo ""
          echo "TAILSCALE:"
          sudo tailscale status || true

          echo ""
          echo "TAILSCALE IP:"
          sudo tailscale ip -4 || true

          echo ""
          echo "NETWORK INTERFACES:"
          ip addr

          echo ""
          echo "LISTENING PORTS:"
          ss -lntp || true

      # =========================================================
      # RDP CREDENTIALS
      # =========================================================

      - name: Prepare RDP Login
        shell: pwsh
        env:
          USERNAME: ${{ env.Q4OS_USER }}
          PASSWORD: ${{ env.Q4OS_PASSWORD }}

        run: |
          $user = $env:USERNAME
          $pass = $env:PASSWORD

          "RDP_USER=$user" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "RDP_PASSWORD=$pass" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "RDP credentials prepared."

      # =========================================================
      # DEEPHAT SESSION PANEL
      # =========================================================

      - name: SESSION ACTIVE
        shell: pwsh
        env:
          USERNAME: ${{ env.Q4OS_USER }}
          PASSWORD: ${{ env.Q4OS_PASSWORD }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}

        run: |
          $ip = $env:TAILSCALE_IP
          $user = $env:USERNAME
          $pass = $env:PASSWORD

          Write-Host "===================================================="
          Write-Host "        🚀 SESSION ACTIVE - DEEPHAT TUNED 🚀        "
          Write-Host "===================================================="
          Write-Host "  [+] IP ADDRESS:     $ip"
          Write-Host "  [+] USERNAME:       $user"
          Write-Host "  [+] PASSWORD:       $pass"
          Write-Host "===================================================="
          Write-Host "  [+] STORAGE:        145GB (VIRTUAL EXPANSION)"
          Write-Host "  [+] MODE:           GAMING OVERDRIVE (DEBLOATED)"
          Write-Host "===================================================="
          Write-Host "  [!] STATUS:         ONLINE"
          Write-Host "===================================================="
          Write-Host "  [!] DICA: Use o Windows App para conectar."
          Write-Host "===================================================="

      # =========================================================
      # SERVICE CHECK
      # =========================================================

      - name: Service Check
        run: |
          echo "===================================================="
          echo "SERVICE CHECK"
          echo "===================================================="

          echo ""
          echo "QEMU:"

          if kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
            exit 1
          fi

          echo ""
          echo "noVNC:"

          if kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
          fi

          echo ""
          echo "PORTS:"

          ss -lnt | grep -E ":5900|:6080|:3389" || true

          echo ""
          echo "TAILSCALE:"

          sudo tailscale status || true

      # =========================================================
      # SESSION REPORT
      # =========================================================

      - name: Create Session Report
        run: |
          cat > "$VM_DIR/session-report.txt" <<EOF
          ==========================================
                  DEEPHAT Q4OS SESSION
          ==========================================

          VM:
          $VM_NAME

          RAM:
          ${RAM_MB}MB

          CPU:
          $CPU_CORES

          STORAGE:
          $DISK_SIZE

          USERNAME:
          $Q4OS_USER

          TAILSCALE IP:
          $TAILSCALE_IP

          VNC PORT:
          $VNC_PORT

          NOVNC PORT:
          $NOVNC_PORT

          RDP PORT:
          $RDP_PORT

          STATUS:
          ONLINE

          ==========================================
          EOF

          cat "$VM_DIR/session-report.txt"

      # =========================================================
      # MONITOR
      # =========================================================

      - name: Monitor Session
        run: |
          set -e

          echo "===================================================="
          echo "        DEEPHAT SESSION MONITOR"
          echo "===================================================="

          while true
          do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null
            then
              echo "QEMU STOPPED."
              echo ""
              echo "===== QEMU LOG ====="
              cat "$VM_DIR/logs/qemu.log" || true
              exit 1
            fi

            if [ -f "$VM_DIR/novnc.pid" ]; then
              if ! kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null
              then
                echo "WARNING: noVNC stopped."
              fi
            fi

            echo "[$(date)] Q4OS VM ONLINE"
            echo "[$(date)] Tailscale: $TAILSCALE_IP"

            sleep 300
          done

      # =========================================================
      # ARTIFACTS
      # =========================================================

      - name: Save DeepHat Logs
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: DeepHat-Q4OS-Session-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            /home/runner/q4os/logs/
            /home/runner/q4os/session-report.txt
            /home/runner/q4os/vm-info.txt

          retention-days: 1
