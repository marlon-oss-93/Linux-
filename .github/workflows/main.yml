name: Q4OS Trinity - DeepHat Advanced RDP

on:
  workflow_dispatch:

jobs:
  q4os-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      VM_NAME: q4os-mobile
      VM_DIR: /home/runner/q4os

      RAM_MB: 1024
      CPU_CORES: 2
      DISK_SIZE: 145G

      Q4OS_USER: ZynexDEX
      Q4OS_PASSWORD: ZynexDEX123!

      VNC_DISPLAY: 0
      VNC_PORT: 5900
      NOVNC_PORT: 6080
      RDP_PORT: 3389

      Q4OS_ISO: q4os-6.9-x64-instcd.r1.iso
      Q4OS_ISO_URL: https://sourceforge.net/projects/q4os/files/stable/q4os-6.9-x64-instcd.r1.iso/download

    steps:

      - name: System Information
        run: |
          echo "===================================================="
          echo "        DEEPHAT Q4OS SYSTEM INITIALIZER"
          echo "===================================================="
          echo "HOSTNAME: $(hostname)"
          echo "KERNEL: $(uname -a)"
          echo "CPU: $(nproc)"
          echo ""
          free -h
          echo ""
          df -h
          echo "===================================================="

      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            wget \
            curl \
            git \
            python3 \
            xz-utils \
            net-tools \
            iproute2 \
            procps \
            jq

          echo "===================================================="
          echo "DEPENDENCIES INSTALLED"
          echo "===================================================="

          qemu-system-x86_64 --version
          qemu-img --version

      - name: Prepare Workspace
        run: |
          set -e

          mkdir -p "$VM_DIR"
          mkdir -p "$VM_DIR/logs"
          mkdir -p "$VM_DIR/scripts"
          mkdir -p "$VM_DIR/novnc"

          echo "Workspace ready: $VM_DIR"

      - name: Download Q4OS
        run: |
          set -e

          cd "$VM_DIR"

          echo "===================================================="
          echo "DOWNLOADING Q4OS"
          echo "===================================================="

          wget \
            --progress=bar:force \
            --tries=3 \
            --timeout=60 \
            -O "$Q4OS_ISO" \
            "$Q4OS_ISO_URL"

          test -s "$Q4OS_ISO"

          echo "Q4OS ISO downloaded."
          ls -lh "$Q4OS_ISO"

      - name: Validate Q4OS ISO
        run: |
          set -e

          cd "$VM_DIR"

          file "$Q4OS_ISO"

          if [ ! -s "$Q4OS_ISO" ]; then
            echo "ERROR: Invalid Q4OS ISO."
            exit 1
          fi

          echo "ISO validation OK."

      - name: Create 145GB Virtual Disk
        run: |
          set -e

          DISK="$VM_DIR/$VM_NAME.qcow2"

          echo "===================================================="
          echo "CREATING 145GB VIRTUAL DISK"
          echo "===================================================="

          qemu-img create \
            -f qcow2 \
            -o lazy_refcounts=on \
            "$DISK" \
            "$DISK_SIZE"

          qemu-img info "$DISK"

      - name: Create VM Configuration
        run: |
          cat > "$VM_DIR/vm-info.txt" <<EOF
          VM_NAME=$VM_NAME
          RAM_MB=$RAM_MB
          CPU_CORES=$CPU_CORES
          DISK_SIZE=$DISK_SIZE
          Q4OS_USER=$Q4OS_USER
          VNC_PORT=$VNC_PORT
          NOVNC_PORT=$NOVNC_PORT
          RDP_PORT=$RDP_PORT
          EOF

          cat "$VM_DIR/vm-info.txt"

      - name: Start Q4OS VM
        run: |
          set -e

          cd "$VM_DIR"

          QEMU_LOG="$VM_DIR/logs/qemu.log"

          echo "===================================================="
          echo "STARTING Q4OS VM"
          echo "===================================================="

          nohup qemu-system-x86_64 \
            -name "$VM_NAME" \
            -machine q35 \
            -accel tcg,thread=multi \
            -m "$RAM_MB" \
            -smp "$CPU_CORES" \
            -cpu max \
            -drive file="$VM_NAME.qcow2",format=qcow2,if=virtio,cache=writeback \
            -cdrom "$Q4OS_ISO" \
            -boot order=d \
            -vga virtio \
            -display none \
            -vnc "0.0.0.0:$VNC_DISPLAY" \
            -netdev user,id=net0,hostfwd=tcp::${RDP_PORT}-:3389 \
            -device virtio-net-pci,netdev=net0 \
            > "$QEMU_LOG" 2>&1 &

          echo $! > "$VM_DIR/qemu.pid"

          sleep 10

          if kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
            echo "QEMU STATUS: ONLINE"
          else
            echo "ERROR: QEMU failed."
            cat "$QEMU_LOG"
            exit 1
          fi

      - name: Install noVNC
        run: |
          set -e

          if [ ! -d "$VM_DIR/novnc/.git" ]; then
            git clone \
              --depth 1 \
              https://github.com/novnc/noVNC.git \
              "$VM_DIR/novnc"
          fi

          test -f "$VM_DIR/novnc/utils/novnc_proxy"

          echo "noVNC installed."

      - name: Start noVNC
        run: |
          set -e

          cd "$VM_DIR/novnc"

          nohup ./utils/novnc_proxy \
            --vnc "127.0.0.1:$VNC_PORT" \
            --listen "0.0.0.0:$NOVNC_PORT" \
            > "$VM_DIR/logs/novnc.log" 2>&1 &

          echo $! > "$VM_DIR/novnc.pid"

          sleep 5

          if kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null; then
            echo "noVNC STATUS: ONLINE"
          else
            echo "ERROR: noVNC failed."
            cat "$VM_DIR/logs/novnc.log"
            exit 1
          fi

      # =========================================================
      # TAILSCALE
      # =========================================================

      - name: Install Tailscale
        run: |
          set -e

          echo "===================================================="
          echo "INSTALLING TAILSCALE"
          echo "===================================================="

          curl -fsSL https://tailscale.com/install.sh | sh

          echo "Starting tailscaled..."

          sudo service tailscaled start || true

          sleep 5

          if ! pgrep -x tailscaled >/dev/null; then
            echo "ERROR: tailscaled did not start."
            sudo service tailscaled status || true
            exit 1
          fi

          echo "TAILSCALED: ONLINE"
          tailscale version

      # =========================================================
      # TAILSCALE AUTHENTICATION
      # =========================================================

      - name: Tailscale Authentication
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |
          set -e

          echo "===================================================="
          echo "             TAILSCALE LOGIN"
          echo "===================================================="

          if [ -z "${TS_AUTH_KEY:-}" ]; then
            echo ""
            echo "===================================================="
            echo "ERROR: TAILSCALE_AUTHKEY IS NOT AVAILABLE"
            echo "===================================================="
            echo ""
            echo "The GitHub Repository Secret must be named:"
            echo ""
            echo "TAILSCALE_AUTHKEY"
            echo ""
            echo "Go to:"
            echo "Settings"
            echo "  -> Secrets and variables"
            echo "  -> Actions"
            echo "  -> Repository secrets"
            echo ""
            echo "Then create:"
            echo "TAILSCALE_AUTHKEY"
            echo ""
            exit 1
          fi

          echo "Auth key detected."
          echo "Connecting to Tailscale..."

          sudo tailscale up \
            --auth-key="$TS_AUTH_KEY" \
            --hostname="gh-q4os-${GITHUB_RUN_ID}" \
            --accept-routes=false \
            --timeout=30s

          sleep 5

          echo ""
          echo "===================================================="
          echo "TAILSCALE STATUS"
          echo "===================================================="

          sudo tailscale status

          TS_IP="$(sudo tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale IP was not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo ""
          echo "===================================================="
          echo "      TAILSCALE LOGIN SUCCESS"
          echo "===================================================="
          echo "HOSTNAME: gh-q4os-${GITHUB_RUN_ID}"
          echo "IP: $TS_IP"
          echo "===================================================="

      - name: Network Diagnostics
        run: |
          echo "===================================================="
          echo "NETWORK DIAGNOSTICS"
          echo "===================================================="

          echo ""
          echo "Tailscale:"
          sudo tailscale status || true

          echo ""
          echo "Tailscale IPv4:"
          sudo tailscale ip -4 || true

          echo ""
          echo "Network interfaces:"
          ip addr

          echo ""
          echo "Listening ports:"
          ss -lntp || true

      - name: Prepare Login Information
        run: |
          echo "RDP_USER=$Q4OS_USER" >> "$GITHUB_ENV"
          echo "RDP_PASSWORD=$Q4OS_PASSWORD" >> "$GITHUB_ENV"

      - name: SESSION ACTIVE
        shell: pwsh
        env:
          USERNAME: ${{ env.Q4OS_USER }}
          PASSWORD: ${{ env.Q4OS_PASSWORD }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}

        run: |
          $ip = $env:TAILSCALE_IP
          $user = $env:USERNAME
          $pass = $env:PASSWORD

          Write-Host "===================================================="
          Write-Host "        🚀 SESSION ACTIVE - DEEPHAT TUNED 🚀        "
          Write-Host "===================================================="
          Write-Host "  [+] IP ADDRESS:     $ip"
          Write-Host "  [+] USERNAME:       $user"
          Write-Host "  [+] PASSWORD:       $pass"
          Write-Host "===================================================="
          Write-Host "  [+] STORAGE:        145GB (VIRTUAL EXPANSION)"
          Write-Host "  [+] RAM:             1GB"
          Write-Host "  [+] CPU:             2 vCPU"
          Write-Host "  [+] MODE:           GAMING OVERDRIVE (DEBLOATED)"
          Write-Host "===================================================="
          Write-Host "  [!] STATUS:         ONLINE"
          Write-Host "===================================================="
          Write-Host "  [!] DICA: Use o Windows App para conectar."
          Write-Host "===================================================="

      - name: Service Check
        run: |
          echo "===================================================="
          echo "SERVICE CHECK"
          echo "===================================================="

          echo ""
          echo "QEMU:"

          if kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
            exit 1
          fi

          echo ""
          echo "noVNC:"

          if kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
          fi

          echo ""
          echo "PORTS:"
          ss -lnt | grep -E ":5900|:6080|:3389" || true

          echo ""
          echo "TAILSCALE:"
          sudo tailscale status || true

      - name: Create Session Report
        run: |
          cat > "$VM_DIR/session-report.txt" <<EOF
          ==========================================
                  DEEPHAT Q4OS SESSION
          ==========================================

          VM:
          $VM_NAME

          RAM:
          ${RAM_MB}MB

          CPU:
          $CPU_CORES

          STORAGE:
          $DISK_SIZE

          USERNAME:
          $Q4OS_USER

          TAILSCALE IP:
          $TAILSCALE_IP

          VNC PORT:
          $VNC_PORT

          NOVNC PORT:
          $NOVNC_PORT

          RDP PORT:
          $RDP_PORT

          STATUS:
          ONLINE

          ==========================================
          EOF

          cat "$VM_DIR/session-report.txt"

      - name: Monitor Session
        run: |
          set -e

          echo "===================================================="
          echo "        DEEPHAT SESSION MONITOR"
          echo "===================================================="

          while true
          do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null
            then
              echo "QEMU STOPPED."
              echo ""
              echo "===== QEMU LOG ====="
              cat "$VM_DIR/logs/qemu.log" || true
              exit 1
            fi

            if [ -f "$VM_DIR/novnc.pid" ]; then
              if ! kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null
              then
                echo "WARNING: noVNC stopped."
              fi
            fi

            echo "[$(date)] Q4OS VM ONLINE"
            echo "[$(date)] Tailscale: $TAILSCALE_IP"

            sleep 300
          done

      # =========================================================
      # ARTIFACT
      # =========================================================

      - name: Save DeepHat Logs
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: DeepHat-Q4OS-Session-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            /home/runner/q4os/logs/
            /home/runner/q4os/session-report.txt
            /home/runner/q4os/vm-info.txt

          retention-days: 1SCALE_AUTHKEY secret is missing."
            echo ""
            echo "Create this GitHub Repository Secret:"
            echo ""
            echo "TAILSCALE_AUTHKEY"
            echo ""
            exit 1
          fi

          echo "Auth key detected."
          echo "Connecting to Tailscale..."

          sudo tailscale up \
            --auth-key="$TS_AUTH_KEY" \
            --hostname="gh-q4os-${GITHUB_RUN_ID}" \
            --accept-routes=false \
            --timeout=30s

          sleep 5

          echo ""
          echo "===================================================="
          echo "TAILSCALE STATUS"
          echo "===================================================="

          sudo tailscale status

          TS_IP=$(sudo tailscale ip -4 | head -n 1)

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale IP was not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo ""
          echo "===================================================="
          echo "      TAILSCALE LOGIN SUCCESS"
          echo "===================================================="
          echo "Hostname: gh-q4os-${GITHUB_RUN_ID}"
          echo "IP: $TS_IP"
          echo "===================================================="

      # =========================================================
      # NETWORK DIAGNOSTICS
      # =========================================================

      - name: Network Diagnostics
        run: |
          echo "===================================================="
          echo "NETWORK DIAGNOSTICS"
          echo "===================================================="

          echo ""
          echo "TAILSCALE:"
          sudo tailscale status || true

          echo ""
          echo "TAILSCALE IP:"
          sudo tailscale ip -4 || true

          echo ""
          echo "NETWORK INTERFACES:"
          ip addr

          echo ""
          echo "LISTENING PORTS:"
          ss -lntp || true

      # =========================================================
      # RDP CREDENTIALS
      # =========================================================

      - name: Prepare RDP Login
        shell: pwsh
        env:
          USERNAME: ${{ env.Q4OS_USER }}
          PASSWORD: ${{ env.Q4OS_PASSWORD }}

        run: |
          $user = $env:USERNAME
          $pass = $env:PASSWORD

          "RDP_USER=$user" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "RDP_PASSWORD=$pass" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "RDP credentials prepared."

      # =========================================================
      # DEEPHAT SESSION PANEL
      # =========================================================

      - name: SESSION ACTIVE
        shell: pwsh
        env:
          USERNAME: ${{ env.Q4OS_USER }}
          PASSWORD: ${{ env.Q4OS_PASSWORD }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}

        run: |
          $ip = $env:TAILSCALE_IP
          $user = $env:USERNAME
          $pass = $env:PASSWORD

          Write-Host "===================================================="
          Write-Host "        🚀 SESSION ACTIVE - DEEPHAT TUNED 🚀        "
          Write-Host "===================================================="
          Write-Host "  [+] IP ADDRESS:     $ip"
          Write-Host "  [+] USERNAME:       $user"
          Write-Host "  [+] PASSWORD:       $pass"
          Write-Host "===================================================="
          Write-Host "  [+] STORAGE:        145GB (VIRTUAL EXPANSION)"
          Write-Host "  [+] MODE:           GAMING OVERDRIVE (DEBLOATED)"
          Write-Host "===================================================="
          Write-Host "  [!] STATUS:         ONLINE"
          Write-Host "===================================================="
          Write-Host "  [!] DICA: Use o Windows App para conectar."
          Write-Host "===================================================="

      # =========================================================
      # SERVICE CHECK
      # =========================================================

      - name: Service Check
        run: |
          echo "===================================================="
          echo "SERVICE CHECK"
          echo "===================================================="

          echo ""
          echo "QEMU:"

          if kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
            exit 1
          fi

          echo ""
          echo "noVNC:"

          if kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
          fi

          echo ""
          echo "PORTS:"

          ss -lnt | grep -E ":5900|:6080|:3389" || true

          echo ""
          echo "TAILSCALE:"

          sudo tailscale status || true

      # =========================================================
      # SESSION REPORT
      # =========================================================

      - name: Create Session Report
        run: |
          cat > "$VM_DIR/session-report.txt" <<EOF
          ==========================================
                  DEEPHAT Q4OS SESSION
          ==========================================

          VM:
          $VM_NAME

          RAM:
          ${RAM_MB}MB

          CPU:
          $CPU_CORES

          STORAGE:
          $DISK_SIZE

          USERNAME:
          $Q4OS_USER

          TAILSCALE IP:
          $TAILSCALE_IP

          VNC PORT:
          $VNC_PORT

          NOVNC PORT:
          $NOVNC_PORT

          RDP PORT:
          $RDP_PORT

          STATUS:
          ONLINE

          ==========================================
          EOF

          cat "$VM_DIR/session-report.txt"

      # =========================================================
      # MONITOR
      # =========================================================

      - name: Monitor Session
        run: |
          set -e

          echo "===================================================="
          echo "        DEEPHAT SESSION MONITOR"
          echo "===================================================="

          while true
          do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null
            then
              echo "QEMU STOPPED."
              echo ""
              echo "===== QEMU LOG ====="
              cat "$VM_DIR/logs/qemu.log" || true
              exit 1
            fi

            if [ -f "$VM_DIR/novnc.pid" ]; then
              if ! kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null
              then
                echo "WARNING: noVNC stopped."
              fi
            fi

            echo "[$(date)] Q4OS VM ONLINE"
            echo "[$(date)] Tailscale: $TAILSCALE_IP"

            sleep 300
          done

      # =========================================================
      # ARTIFACTS
      # =========================================================

      - name: Save DeepHat Logs
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: DeepHat-Q4OS-Session-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            /home/runner/q4os/logs/
            /home/runner/q4os/session-report.txt
            /home/runner/q4os/vm-info.txt

          retention-days: 1
